name: PR · Repository

on:
  pull_request:
    branches: [develop, staging, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository / quality
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate promotion source
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: bash tools/ci/validate_promotion_source.sh "$BASE_BRANCH" "$HEAD_BRANCH" "$SOURCE_REPOSITORY" "$TARGET_REPOSITORY"
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run --frozen poe check

  portability:
    name: Portability / ${{ matrix.os }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run --frozen pytest
